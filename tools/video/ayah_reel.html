<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<!-- Frame template for tools/video/ayah_reel.py. All Quran text arrives in the spec from content.db; none is written here. -->
<style>
@font-face { font-family: UthmanicHafs; src: url(../../assets/fonts/kfgqpc/uthmanic_hafs_v20.ttf); }
@font-face { font-family: Changa; src: url("../../assets/fonts/ofl/changa/Changa[wght].ttf"); font-weight: 200 800; }
:root { --teal: #0F6660; --teal-lo: #0A4F4A; --teal-deep: #083F3B; --gold: #D9B266; --cream: #F6F1E8; --mint: #55BDB2; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--teal-lo); }
#stage { position: absolute; inset: 0; color: var(--cream); font-family: Changa, sans-serif;
  background: radial-gradient(120% 70% at 50% 42%, var(--teal) 0%, var(--teal-lo) 62%, var(--teal-deep) 100%); }
/* faint diamond lattice like Cover C */
#stage::before { content: ""; position: absolute; inset: 0; opacity: .07;
  background-image: linear-gradient(45deg, var(--cream) 1px, transparent 1px), linear-gradient(-45deg, var(--cream) 1px, transparent 1px);
  background-size: 120px 120px; }
.frame { position: absolute; inset: 56px; border: 2px solid rgba(217,178,102,.35); border-radius: 28px; }
.frame::after { content: ""; position: absolute; inset: 12px; border: 1px solid rgba(217,178,102,.18); border-radius: 20px; }
.logo { display: block; filter: invert(95%) sepia(9%) saturate(290%) hue-rotate(337deg) brightness(102%); }
.layer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#intro .logo { width: 420px; }
#intro .surah { font-size: 92px; font-weight: 700; margin-top: 70px; color: var(--cream); }
#intro .range { font-size: 46px; color: var(--gold); margin-top: 6px; }
#intro .reciter { font-size: 44px; margin-top: 54px; opacity: .9; }
#intro .rule, #outro .rule { width: 260px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin-top: 40px; }
#head { position: absolute; top: 130px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
#head .logo { width: 150px; }
#head .surah { font-size: 44px; font-weight: 600; margin-top: 18px; }
#head .surah span { color: var(--gold); font-weight: 400; }
#text { position: absolute; left: 110px; right: 110px; top: 420px; bottom: 300px; display: flex; align-items: center; justify-content: center; }
.page { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.ayat { font-family: UthmanicHafs; text-align: center; line-height: 2.05; direction: rtl; }
.w { color: var(--cream); opacity: .42; transition: none; }
.w.done { opacity: 1; }
.w.now { opacity: 1; color: var(--gold); text-shadow: 0 0 28px rgba(217,178,102,.45); }
.num { color: var(--gold); opacity: .55; }
.num.done { opacity: 1; }
#credit { position: absolute; bottom: 120px; left: 0; right: 0; text-align: center; font-size: 30px; opacity: .72; }
#outro .cta { font-size: 120px; font-weight: 700; margin-top: 70px; }
#outro .url { font-size: 64px; color: var(--gold); margin-top: 10px; letter-spacing: .5px; direction: ltr; font-weight: 500; }
#outro .stores { font-size: 36px; margin-top: 56px; opacity: .85; direction: ltr; }
#outro .logo { width: 360px; }
</style></head>
<body><div id="stage"><div class="frame"></div>
<div id="intro" class="layer"><img class="logo" src="../../assets/brand/tibyan_logo.svg"><div class="surah"></div><div class="range"></div><div class="rule"></div><div class="reciter"></div></div>
<div id="body" class="layer" style="opacity:0">
  <div id="head"><img class="logo" src="../../assets/brand/tibyan_logo.svg"><div class="surah"></div></div>
  <div id="text"></div>
  <div id="credit"></div>
</div>
<div id="outro" class="layer" style="opacity:0"><img class="logo" src="../../assets/brand/tibyan_logo.svg"><div class="cta">انضم الآن</div><div class="url">altibyan.app</div><div class="rule"></div><div class="stores">Google Play  ·  App Store  ·  Mac</div></div>
</div>
<script>
const ltr = x => '\u2066' + x + '\u2069';
let S, W = [], N = [], pages = [];
const $ = q => document.querySelector(q);
const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => x * x * (3 - 2 * x);

function build(ayat, size) {
  const d = document.createElement('div'); d.className = 'ayat'; d.style.fontSize = size + 'px';
  for (const a of ayat) { // each ayah starts on its own line; a long one wraps within its block
    const l = document.createElement('div');
    const tail = document.createElement('span'); tail.style.whiteSpace = 'nowrap'; // last word never parts from its marker
    a.words.forEach((w, i) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w.t; s._w = w; (i === a.words.length - 1 ? tail : l).append(s, ' '); });
    const n = document.createElement('span'); n.className = 'num'; n.textContent = a.glyph; n._end = a.words.at(-1).s; tail.append(n); l.append(tail);
    d.append(l);
  }
  return d;
}
function fits(el, box) { return el.scrollHeight <= box.clientHeight && el.scrollWidth <= box.clientWidth; }

async function setup(spec) {
  S = spec;
  $('#intro .surah').textContent = 'سورة ' + S.surah;
  $('#intro .range').textContent = (S.range.includes(' ') ? 'الآيات ' : 'الآية ') + S.range;
  $('#intro .reciter').textContent = 'بصوت الشيخ ' + S.reciter;
  $('#head .surah').innerHTML = ''; $('#head .surah').append('سورة ' + S.surah + ' ');
  const sp = document.createElement('span'); sp.textContent = '· ' + S.range; $('#head .surah').append(sp);
  $('#credit').textContent = 'تلاوة الشيخ ' + S.reciter + ' · mp3quran.net';
  await document.fonts.load('80px UthmanicHafs', S.ayat[0].words[0].t);
  await document.fonts.load('600 40px Changa', 'سورة'); await document.fonts.ready;
  if (!document.fonts.check('80px UthmanicHafs')) return 'mushaf font not loaded';
  const box = $('#text');
  // one page with every ayah at the biggest size that fits; else pages of whole ayat at a fixed size
  let size = 110, el;
  for (; size >= 70; size -= 2) { box.innerHTML = ''; el = build(S.ayat, size); box.append(el); if (fits(el, box)) break; }
  box.innerHTML = '';
  if (size >= 70) pages = [S.ayat];
  else {
    size = 84; pages = [];
    let cur = [];
    for (const a of S.ayat) {
      const tryA = [...cur, a]; box.innerHTML = ''; const e = build(tryA, size); box.append(e);
      if (fits(e, box) || !cur.length) cur = tryA; else { pages.push(cur); cur = [a]; }
    }
    if (cur.length) pages.push(cur); box.innerHTML = '';
  }
  pages = pages.map(p => { const pg = document.createElement('div'); pg.className = 'page'; pg.append(build(p, size)); box.append(pg);
    return { el: pg, start: p[0].words[0].s, words: [...pg.querySelectorAll('.w')], nums: [...pg.querySelectorAll('.num')] }; });
  W = pages.flatMap(p => p.words);
  return true;
}

function frame(t) {
  const iOut = 1 - ease(clamp((t - (S.intro - 0.45)) / 0.45));
  const iIn = ease(clamp(t / 0.35));
  $('#intro').style.opacity = Math.min(iIn, iOut);
  const bIn = ease(clamp((t - (S.intro - 0.3)) / 0.4)), bOut = 1 - ease(clamp((t - S.bodyEnd) / 0.4));
  $('#body').style.opacity = Math.min(bIn, bOut);
  $('#outro').style.opacity = ease(clamp((t - S.bodyEnd - 0.25) / 0.45));
  // current word: last one whose start has passed (stays lit through the reciter's pause)
  let now = -1; for (let i = 0; i < W.length; i++) if (W[i]._w.s <= t) now = i;
  W.forEach((w, i) => { w.className = 'w' + (i < now ? ' done' : i === now ? ' now' : ''); });
  if (now === W.length - 1 && t > W[now]._w.e + 0.15) W[now].className = 'w done';
  // ayah marker lights once its last word has been reached
  pages.forEach(p => p.nums.forEach(n => n.className = 'num' + (t >= n._end ? ' done' : '')));
  // page switch: a page shows from its first word (first page from the start), crossfading 0.3s
  pages.forEach((p, k) => {
    const from = k === 0 ? -1 : p.start - 0.15, to = k + 1 < pages.length ? pages[k + 1].start - 0.15 : 1e9;
    p.el.style.opacity = Math.min(clamp((t - from) / 0.3), 1 - clamp((t - to) / 0.3));
  });
  return true;
}
</script></body></html>

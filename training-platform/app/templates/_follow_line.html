<p class="follow-line">
  <span class="star" aria-hidden="true"></span>
  <span>{{ 'تابعنا على' if ar else 'Follow us on' }}</span>
  <a class="social-link" href="{{ facebook_url }}" target="_blank" rel="noopener"
     aria-label="{{ 'تابعنا على فيسبوك (تفتح في نافذة جديدة)' if ar else 'Follow us on Facebook (opens in a new tab)' }}">
    <span class="fb-glyph" aria-hidden="true">f</span><span>{{ 'فيسبوك' if ar else 'Facebook' }}</span>
  </a>
  <span aria-hidden="true">{{ 'و' if ar else '&' }}</span>
  <a class="social-link" href="{{ instagram_url }}" target="_blank" rel="noopener"
     aria-label="{{ 'تابعنا على إنستجرام (تفتح في نافذة جديدة)' if ar else 'Follow us on Instagram (opens in a new tab)' }}">
    <svg class="ig-glyph" aria-hidden="true" viewBox="0 0 24 24" width="1.35em" height="1.35em" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg><span>{{ 'إنستجرام' if ar else 'Instagram' }}</span>
  </a>
</p>

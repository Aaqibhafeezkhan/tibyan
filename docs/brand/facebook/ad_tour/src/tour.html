<script>
const q=new URLSearchParams(location.search);const FMT=q.get('f')||'reel';const CUT=q.get('c')||'30';
const H=FMT==='feed'?1350:1920;document.documentElement.style.height=document.body.style.height=H+'px';
document.getElementById('bgsvg').setAttribute('height',H);
// layout
const L=FMT==='feed'?{cap:70,phone:{top:300,h:1000},lap:{top:420,w:960},end:250}:{cap:250,phone:{top:470,h:1010},lap:{top:640,w:980},end:470};
const ph=document.getElementById('phone');const pw=Math.round(L.phone.h*0.46);
Object.assign(ph.style,{top:L.phone.top+'px',height:L.phone.h+'px',width:pw+'px',left:(540-pw/2)+'px'});
const lp=document.getElementById('laptop');const lw=L.lap.w;Object.assign(lp.style,{top:L.lap.top+'px',width:lw+'px',left:(540-lw/2)+'px'});
const ls=document.getElementById('lscr');ls.style.height=Math.round((lw-44)/1.6)+'px';
document.getElementById('cap').style.top=L.cap+'px';document.getElementById('end').style.top=L.end+'px';
const SC=SCENES[CUT];let t0=0;for(const s of SC){s.t0=t0;t0+=s.d;}
const TOTAL=t0;
const els=SC.map(s=>{if(!s.clip)return null;let e;if(s.still){e=document.createElement('img');e.className='still';e.src=s.clip;}else{e=document.createElement('video');e.src=s.clip;e.muted=true;e.preload='auto';}
 e.style.opacity=0;(s.dev==='laptop'?ls:document.getElementById('pscr')).appendChild(e);return e;});
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
window.ready=Promise.all(els.filter(e=>e&&e.tagName==='VIDEO').map(v=>new Promise(r=>{if(v.readyState>=2)r();else v.addEventListener('loadeddata',r,{once:true});})));
function seek(v,tt){return new Promise(r=>{if(Math.abs(v.currentTime-tt)<0.001){r();return;}v.addEventListener('seeked',()=>r(),{once:true});v.currentTime=tt;});}
window.render=async function(t){
 let i=SC.findIndex(s=>t>=s.t0&&t<s.t0+s.d);if(i<0)i=SC.length-1;const s=SC[i];const lt=t-s.t0;
 const fin=ease(lt/0.35), fout=1-ease((lt-(s.d-0.3))/0.3);
 const isEnd=!s.clip; const ps=[];
 // devices
 const devOp=isEnd?0:1;
 ph.style.opacity=(s.dev==='phone'&&!isEnd)?1:0; lp.style.opacity=(s.dev==='laptop')?1:0;
 const prev=SC[i-1];const swap=prev&&prev.dev!==s.dev;
 const dv=s.dev==='laptop'?lp:ph; const k=swap||i===0?ease(lt/0.4):1;
 dv.style.transform=`translateY(${(1-k)*60}px) scale(${0.96+0.04*k})`; if(swap||i===0)dv.style.opacity=k;
 if(isEnd){const p=prev&&prev.dev==='laptop'?lp:ph;const kk=1-ease(lt/0.35);p.style.opacity=kk;p.style.transform=`scale(${0.96+0.04*kk})`;}
 const hold=isEnd&&els[i-1]?i-1:-1;
 els.forEach((e,j)=>{if(!e)return;if(j===hold){e.style.opacity=1;if(e.tagName==='VIDEO')ps.push(seek(e,SC[j].in+SC[j].d-0.04));return;}const on=j===i;e.style.opacity=on?1:0;if(on&&e.tagName==='VIDEO')ps.push(seek(e,s.in+lt*(s.rate||1)));
  if(on&&e.tagName==='IMG'){const z=1+0.06*(lt/s.d);e.style.transform=`scale(${z})`;e.style.transformOrigin=s.origin||'50% 40%';}});
 // caption
 const cap=document.getElementById('cap');
 document.getElementById('capk').textContent=s.k||'';document.getElementById('capk').style.display=s.k?'inline-block':'none';
 document.getElementById('capt').textContent=s.cap||'';document.getElementById('capt').style.fontSize=(s.big?78:62)+'px';
 cap.style.opacity=isEnd?0:Math.min(fin,fout);cap.style.transform=`translateY(${(1-fin)*24}px)`;
 const end=document.getElementById('end');end.style.opacity=isEnd?ease(lt/0.5):0;end.style.transform=`translateY(${isEnd?(1-ease(lt/0.5))*30:0}px)`;
 await Promise.all(ps);
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
};
window.TOTAL=TOTAL;

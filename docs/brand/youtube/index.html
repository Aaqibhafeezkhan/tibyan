<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tibyan YouTube Banner</title>
<style>
:root{--bg:#0B3F3B;--fg:#F6F1E8;--mute:#A9CBC6;--gold:#D9B266}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:24px 16px}
main{max-width:1100px;margin:auto}h1{font-size:22px;margin:0 0 4px}p{color:var(--mute);margin:0 0 16px;font-size:14px}
.wrap{position:relative;width:100%;aspect-ratio:16/9;background:url(youtube_banner_2560x1440.png?v=1) center/cover}
.box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2px dashed;pointer-events:none}
.box span{position:absolute;top:2px;inset-inline-start:6px;font-size:11px;background:rgba(0,0,0,.55);padding:1px 5px}
.tv{width:100%;height:100%;border-color:#fff}.dt{width:100%;height:29.375%;border-color:#7fd}.tb{width:72.46%;height:29.375%;border-color:var(--gold)}.mb{width:60.39%;height:29.375%;border-color:#f66}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin:12px 0 28px}
h2{font-size:17px;margin:28px 0 10px}.crops{display:grid;gap:14px}
.crop{background:url(youtube_banner_2560x1440.png?v=1) no-repeat;background-size:auto 100%}
.c-dt{aspect-ratio:2560/423;background-size:100% auto;background-position:center}
.c-tb{aspect-ratio:1855/423;background-size:138% auto;background-position:center;max-width:72%}
.c-mb{aspect-ratio:1546/423;background-size:165.6% auto;background-position:center;max-width:60%}
.icons{display:flex;gap:24px;align-items:center}.icons img{width:160px;height:160px;border-radius:50%}.icons img.sq{border-radius:12px}
a{color:var(--gold)}
</style></head><body><main>
<h1>بانر يوتيوب — تبيان</h1><p>2560×1440 · المربعات توضح ما يظهر على كل جهاز</p>
<div class="wrap"><div class="box tv"><span>TV 2560×1440</span></div><div class="box dt"><span>Desktop 2560×423</span></div><div class="box tb"><span>Tablet 1855×423</span></div><div class="box mb"><span>Mobile / safe 1546×423</span></div></div>
<h2>القص الفعلي</h2><div class="crops"><small>Desktop</small><div class="crop c-dt"></div><small>Tablet</small><div class="crop c-tb"></div><small>Mobile</small><div class="crop c-mb"></div></div>
<h2>أيقونة القناة 800×800 (قص دائري)</h2><div class="icons"><img src="youtube_icon_800.png?v=1" alt="أيقونة دائرية"><img class="sq" src="youtube_icon_800.png?v=1" alt="الأصل"></div>
<p style="margin-top:20px"><a href="youtube_banner_2560x1440.png?v=1">تحميل البانر</a> · <a href="youtube_icon_800.png?v=1">تحميل الأيقونة</a></p>
</main></body></html>

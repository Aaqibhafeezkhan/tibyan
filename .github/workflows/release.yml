name: Release

on:
  push:
    tags: ['v*']
  # Rebuild only the Windows and Linux apps of an existing tag; the files are
  # kept as workflow artifacts and attached to the release by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.7.0'
        required: true
      platforms:
        description: 'Which apps to rebuild'
        type: choice
        default: all
        options: [all, linux, linux-arm64]

permissions:
  contents: write

jobs:
  android:
    if: github.event_name == 'push'
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/lfs-pull
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: The tag matches pubspec.yaml
        run: python3 tools/release/check_version.py "$GITHUB_REF_NAME"
      # With the keystore secrets (docs/RELEASE.md) the build is signed with
      # the upload key; without them it falls back to the debug key, fine for
      # testing and not for the Play Store.
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/upload.jks
            {
              echo "storeFile=upload.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          else
            echo "No keystore secret: signing with the debug key."
          fi
      # Per-ABI APKs: each carries one ABI's native libs (arm64-v8a is the one
      # nearly every phone needs). The Play bundle below is split by Play itself.
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      # Internal testing track on Google Play, when the service account is
      # set (docs/RELEASE.md); otherwise nothing is uploaded.
      - name: Google Play internal track
        env:
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_KEY" ]; then
            echo "$PLAY_KEY" > "$RUNNER_TEMP/play.json"
            python3 tools/play_upload.py build/app/outputs/bundle/release/app-release.aab \
              --key "$RUNNER_TEMP/play.json" --name "${GITHUB_REF_NAME#v}"
          else
            echo "No Play service account secret: not uploaded."
          fi
      - run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-*-release.apk out/
          cp build/app/outputs/bundle/release/app-release.aab out/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-android
          path: out/

  ios:
    if: github.event_name == 'push'
    name: iOS build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/lfs-pull
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      # Unsigned: it is signed and uploaded from Xcode or Transporter with
      # the team's certificate (docs/RELEASE.md).
      - name: Zip the unsigned app
        run: |
          cd build/ios/iphoneos
          zip -qry ../../../tibyan-ios-unsigned.zip Runner.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-ios
          path: tibyan-ios-unsigned.zip

  macos:
    if: github.event_name == 'push'
    name: macOS build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/lfs-pull
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      # No certificates on CI: build the app without code signing.
      - run: |
          flutter build macos --release --config-only
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release \
            -derivedDataPath build/macos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Zip and disk image of the app
        run: |
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          ditto -c -k --keepParent "$app" tibyan-macos-unsigned.zip
          hdiutil create -volname Tibyan -srcfolder "$app" -ov -format UDZO tibyan-macos-unsigned.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-macos
          path: |
            tibyan-macos-unsigned.zip
            tibyan-macos-unsigned.dmg

  linux:
    if: inputs.platforms != 'linux-arm64'
    name: Linux build
    # 22.04 (glibc 2.35), not ubuntu-latest: what is built here runs on
    # Ubuntu 22.04, Debian 12 and newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      # The packaging scripts come from this workflow's commit, so an older tag
      # can be packaged too (workflow_dispatch).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _pkg
          sparse-checkout: linux/packaging
      - name: Packaging scripts from this workflow's commit
        run: rm -rf linux/packaging && cp -r _pkg/linux/packaging linux/packaging && rm -rf _pkg
      - uses: ./.github/actions/lfs-pull
      - name: Build tools (GTK, libmpv, libcurl, dpkg-dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev mpv libsecret-1-dev libjsoncpp-dev \
            libcurl4-openssl-dev dpkg-dev file desktop-file-utils
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Crash reporting and Drive config (secrets)
        env:
          SENTRY_ENV: ${{ secrets.TIBYAN_SENTRY_ENV }}
          GOOGLE_ENV: ${{ secrets.TIBYAN_GOOGLE_ENV }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tibyan"
          printf '%s\n' "$SENTRY_ENV" > "$RUNNER_TEMP/tibyan/sentry.env"
          printf '%s\n' "$GOOGLE_ENV" > "$RUNNER_TEMP/tibyan/google.env"
      - run: flutter build linux --release --dart-define-from-file="$RUNNER_TEMP/tibyan/sentry.env" --dart-define-from-file="$RUNNER_TEMP/tibyan/google.env" --dart-define=TIBYAN_CHANNEL=beta --split-debug-info=build/symbols/desktop
      - name: Version from pubspec.yaml
        id: ver
        run: |
          v=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          echo "version=${v%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${v##*+}" >> "$GITHUB_OUTPUT"
      # The tar.gz still needs libmpv on the reader's system; the .deb pulls it
      # in, and the AppImage carries its own.
      - name: Archive the bundle
        run: tar -C build/linux/x64/release/bundle -czf tibyan-linux-x64.tar.gz .
      - name: Debian package
        run: |
          linux/packaging/build-deb.sh build/linux/x64/release/bundle \
            "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.build }}" .
          desktop-file-validate linux/packaging/app.tibyan.tibyan.desktop
      - name: AppImage
        env:
          LINUXDEPLOY_SHA: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
          APPIMAGETOOL_SHA: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          linux/packaging/build-appimage.sh build/linux/x64/release/bundle \
            "${{ steps.ver.outputs.version }}" .
      - name: Smoke test (.deb on 22.04 / Debian 12 / 24.04, AppImage libs)
        run: linux/packaging/smoke-test.sh .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-linux
          path: |
            tibyan-linux-x64.tar.gz
            tibyan_*_amd64.deb
            tibyan-*-x86_64.AppImage
            tibyan_*_amd64.deb
            tibyan-*-x86_64.AppImage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-linux-symbols
          path: build/symbols/desktop

  linux-arm64:
    name: Linux build (arm64)
    # Same as the amd64 job on GitHub's arm64 runner: 22.04 (glibc 2.35).
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    env:
      FLUTTER_VERSION: 3.47.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _pkg
          sparse-checkout: linux/packaging
      - name: Packaging scripts from this workflow's commit
        run: rm -rf linux/packaging && cp -r _pkg/linux/packaging linux/packaging && rm -rf _pkg
      - uses: ./.github/actions/lfs-pull
      - name: Build tools (GTK, libmpv, libcurl, dpkg-dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev mpv libsecret-1-dev libjsoncpp-dev \
            libcurl4-openssl-dev dpkg-dev file desktop-file-utils
      # Flutter publishes no linux-arm64 SDK archive (flutter-action downloads
      # the x64 one), so clone the release tag; the SDK fetches its arm64 Dart.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}-linux-arm64
      - name: Flutter ${{ env.FLUTTER_VERSION }} (git)
        run: |
          [ -x ~/flutter/bin/flutter ] || git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git ~/flutter
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          ~/flutter/bin/flutter --version
      - run: flutter config --enable-linux-desktop --no-analytics
      - run: flutter pub get
      - name: Crash reporting and Drive config (secrets)
        env:
          SENTRY_ENV: ${{ secrets.TIBYAN_SENTRY_ENV }}
          GOOGLE_ENV: ${{ secrets.TIBYAN_GOOGLE_ENV }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tibyan"
          printf '%s\n' "$SENTRY_ENV" > "$RUNNER_TEMP/tibyan/sentry.env"
          printf '%s\n' "$GOOGLE_ENV" > "$RUNNER_TEMP/tibyan/google.env"
      - run: flutter build linux --release --dart-define-from-file="$RUNNER_TEMP/tibyan/sentry.env" --dart-define-from-file="$RUNNER_TEMP/tibyan/google.env" --dart-define=TIBYAN_CHANNEL=beta --split-debug-info=build/symbols/desktop
      - name: Version from pubspec.yaml
        id: ver
        run: |
          v=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)
          echo "version=${v%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${v##*+}" >> "$GITHUB_OUTPUT"
      - name: Archive the bundle
        run: tar -C build/linux/arm64/release/bundle -czf tibyan-linux-arm64.tar.gz .
      - name: Debian package
        run: |
          linux/packaging/build-deb.sh build/linux/arm64/release/bundle \
            "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.build }}" .
          desktop-file-validate linux/packaging/app.tibyan.tibyan.desktop
      - name: AppImage
        env:
          LINUXDEPLOY_SHA: 620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff
          APPIMAGETOOL_SHA: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
        run: |
          linux/packaging/build-appimage.sh build/linux/arm64/release/bundle \
            "${{ steps.ver.outputs.version }}" .
      - name: Smoke test (.deb on 22.04 / Debian 12 / 24.04, AppImage libs)
        run: linux/packaging/smoke-test.sh .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-linux-arm64
          path: |
            tibyan-linux-arm64.tar.gz
            tibyan_*_arm64.deb
            tibyan-*-aarch64.AppImage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-linux-arm64-symbols
          path: build/symbols/desktop

  windows:
    if: inputs.platforms != 'linux' && inputs.platforms != 'linux-arm64'
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/lfs-pull
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Crash reporting and Drive config (secrets)
        env:
          SENTRY_ENV: ${{ secrets.TIBYAN_SENTRY_ENV }}
          GOOGLE_ENV: ${{ secrets.TIBYAN_GOOGLE_ENV }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tibyan"
          printf '%s\n' "$SENTRY_ENV" > "$RUNNER_TEMP/tibyan/sentry.env"
          printf '%s\n' "$GOOGLE_ENV" > "$RUNNER_TEMP/tibyan/google.env"
      - shell: bash
        run: flutter build windows --release --dart-define-from-file="$RUNNER_TEMP/tibyan/sentry.env" --dart-define-from-file="$RUNNER_TEMP/tibyan/google.env" --dart-define=TIBYAN_CHANNEL=beta --split-debug-info=build/symbols/desktop
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath tibyan-windows-x64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-windows
          path: tibyan-windows-x64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-windows-symbols
          path: build/symbols/desktop

  publish:
    name: GitHub release
    if: github.event_name == 'push'
    needs: [android, ios, macos, linux, linux-arm64, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      # Checksums of the files this job attaches; tools/make_github_release.sh
      # adds the signed APKs' lines when it attaches them.
      - name: SHA256SUMS
        run: |
          sha256sum tibyan-ios-unsigned.zip tibyan-macos-unsigned.zip tibyan-macos-unsigned.dmg \
            tibyan-linux-x64.tar.gz tibyan-linux-arm64.tar.gz tibyan-windows-x64.zip \
            tibyan_*.deb tibyan-*.AppImage > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          body_path: notes.md
          # The Android APK is signed with the upload key on the maintainer's
          # machine (tools/make_github_release.sh) and attached afterwards;
          # CI has no keystore, so its debug-signed build is not published.
          files: |
            tibyan-ios-unsigned.zip
            tibyan-macos-unsigned.zip
            tibyan-macos-unsigned.dmg
            tibyan-linux-x64.tar.gz
            tibyan-linux-arm64.tar.gz
            tibyan-windows-x64.zip
            tibyan_*_amd64.deb
            tibyan_*_arm64.deb
            tibyan-*-x86_64.AppImage
            tibyan-*-aarch64.AppImage
            SHA256SUMS

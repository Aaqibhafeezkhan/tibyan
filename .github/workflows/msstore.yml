name: Microsoft Store

# Builds the Microsoft Store MSIX (TIBYAN_STORE=msstore: no in-app updater).
# Manual only. publish=true submits it to Partner Center (Store ID
# 9N944SZ21PTS); run that only with Ahmed's approval. See docs/RELEASE.md.
on:
  pull_request: # TEMP: verify packaging on the PR; removed before review
  workflow_dispatch:
    inputs:
      publish:
        description: Submit the MSIX to the Microsoft Store
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  msix:
    name: MSIX build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/lfs-pull
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Crash reporting and Drive config (secrets)
        env:
          SENTRY_ENV: ${{ secrets.TIBYAN_SENTRY_ENV }}
          GOOGLE_ENV: ${{ secrets.TIBYAN_GOOGLE_ENV }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tibyan"
          printf '%s\n' "$SENTRY_ENV" > "$RUNNER_TEMP/tibyan/sentry.env"
          printf '%s\n' "$GOOGLE_ENV" > "$RUNNER_TEMP/tibyan/google.env"
      - shell: bash
        run: flutter build windows --release --dart-define-from-file="$RUNNER_TEMP/tibyan/sentry.env" --dart-define-from-file="$RUNNER_TEMP/tibyan/google.env" --dart-define=TIBYAN_STORE=msstore --split-debug-info=build/symbols/desktop
      - name: Package the MSIX
        shell: bash
        run: |
          dart run msix:create --store --build-windows false --output-path build/msix --output-name tibyan
          ls -l build/msix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-msstore-msix
          path: build/msix/tibyan.msix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-msstore-symbols
          path: build/symbols/desktop

      - if: inputs.publish
        uses: microsoft/setup-msstore-cli@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      - name: Submit to the Microsoft Store
        if: inputs.publish
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        shell: pwsh
        run: |
          msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET --sellerId $env:MSSTORE_SELLER_ID
          msstore publish build/msix/tibyan.msix -id 9N944SZ21PTS
